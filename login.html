<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>JTVI - Login</title>
 <style>
 * { margin: 0; padding: 0; box-sizing: border-box; }
 body {
 font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto;
 background: linear-gradient(135deg, #0D2D47 0%, #1a4a6a 100%);
 height: 100vh;
 display: flex;
 justify-content: center;
 align-items: center;
 }
 .login-container {
 background: white;
 border-radius: 12px;
 padding: 40px;
 width: 100%;
 max-width: 400px;
 box-shadow: 0 20px 60px rgba(0,0,0,0.3);
 }
 h1 { color: #0D2D47; margin-bottom: 30px; text-align: center; font-size: 28px; }
 .form-group { margin-bottom: 20px; }
 label { display: block; color: #333; margin-bottom: 8px; font-weight: 500; }
 input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
 input:focus { outline: none; border-color: #7CB342; box-shadow: 0 0 0 3px rgba(124, 179, 66, 0.1); }
 button { width: 100%; padding: 12px; background: #7CB342; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.3s; }
 button:hover { background: #6BA234; }
 .error { color: #d32f2f; font-size: 14px; margin-top: 10px; display: none; }
 </style>
</head>
<body>
 <div class="login-container">
 <h1>📺 JTVI</h1>
 <form id="loginForm">
 <div class="form-group">
 <label for="usuario">Usuario</label>
 <input type="text" id="usuario" placeholder="ej: admin" required>
 </div>
 <div class="form-group">
 <label for="contraseña">Contraseña</label>
 <input type="password" id="contraseña" placeholder="cualquier contraseña" required>
 </div>
 <button type="submit">Ingresar</button>
 <div class="error" id="error">Error en las credenciales</div>
 </form>
 </div>
 <script>
 document.getElementById('loginForm').addEventListener('submit', async (e) => {
 e.preventDefault();
 const usuario = document.getElementById('usuario').value;
 const contraseña = document.getElementById('contraseña').value;
 try {
 const response = await fetch('http://localhost:3000/api/login', {
 method: 'POST',
 headers: { 'Content-Type': 'application/json' },
 body: JSON.stringify({ usuario, contraseña })
 });
 const data = await response.json();
 localStorage.setItem('token', data.token);
 localStorage.setItem('usuario', data.usuario);
 window.location.href = '/dashboard.html';
 } catch (error) {
 document.getElementById('error').style.display = 'block';
 }
 });
 </script>
</body>
</html>
